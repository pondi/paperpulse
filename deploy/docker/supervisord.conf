[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g "daemon off;"
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:meilisearch]
command=meilisearch --db-path /data/meilisearch --http-addr 127.0.0.1:7700 --env development --no-analytics
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:chromedriver]
command=/usr/bin/chromedriver --port=9515
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:bootstrap]
command=bootstrap.sh
directory=/app
priority=30
autostart=true
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:worker]
command=/bin/sh -c "until [ -f /data/runtime/ready ]; do sleep 1; done; exec php artisan queue:work database --queue=default,receipts,documents,conversions,files,exports --sleep=1 --tries=3 --timeout=3660 --max-time=3600"
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=3800
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:scheduler]
command=/bin/sh -c "until [ -f /data/runtime/ready ]; do sleep 1; done; exec php artisan schedule:work --no-interaction"
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:reverb]
command=/bin/sh -c "until [ -f /data/runtime/ready ]; do sleep 1; done; exec php artisan reverb:start --no-interaction"
directory=/app
priority=40
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
user=www-data
environment=HOME="/tmp"

[program:browser-server]
command=php -S 127.0.0.1:8082 -t public
directory=/app
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/tmp",APP_ENV="testing",APP_URL="http://127.0.0.1:8082",DB_CONNECTION="pgsql",DB_DATABASE="paperpulse_browser_test",DB_USERNAME="paperpulse_test",DB_PASSWORD="paperpulse_test",SCOUT_DRIVER="collection",SCOUT_PREFIX="browser_",CACHE_STORE="array",SESSION_DRIVER="database",QUEUE_CONNECTION="database",BROADCAST_CONNECTION="log",MAIL_MAILER="array",GEMINI_API_KEY="isolated-test",OPENAI_API_KEY="isolated-test",TEXTRACT_KEY="isolated-test",TEXTRACT_SECRET="isolated-test"
