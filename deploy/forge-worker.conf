[program:paperpulse-worker]
command=php8.4 /home/forge/paperpulse/artisan queue:work database --queue=default,receipts,documents,conversions,files,exports --sleep=3 --tries=3 --timeout=3660 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
user=forge
redirect_stderr=true
stdout_logfile=/home/forge/paperpulse/storage/logs/worker.log
stopasgroup=true
killasgroup=true
stopwaitsecs=3800
